name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://news:news@localhost:5432/news
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      DEMO_LOGIN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test -- --ci

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 300
      - name: API
        run: |
          curl -fsS http://localhost:8000/health
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/demo | jq -r .access_token)
          AUTH="Authorization: Bearer $TOKEN"
          curl -fsS -H "$AUTH" http://localhost:8000/auth/me
          curl -fsS -H "$AUTH" "http://localhost:8000/onboarding/sample?limit=5"
          curl -fsS -H "$AUTH" http://localhost:8000/articles
      - name: Web app
        run: |
          curl -fsS -o /dev/null -w "/ -> %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "/login -> %{http_code}\n" http://localhost:3000/login
      - name: Metrics endpoints
        run: |
          curl -fsS http://localhost:8000/metrics | grep -m1 score_cache_hits_total
          docker compose exec -T worker curl -fsS localhost:9101 | grep -m1 worker_articles_ingested
      - name: Prometheus scrapes api and worker
        run: |
          for i in $(seq 1 30); do
            up=$(curl -fsS http://localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health == "up")] | length')
            if [ "$up" -ge 2 ]; then echo "targets up: $up"; exit 0; fi
            sleep 2
          done
          curl -fsS http://localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}'
          exit 1
      - name: Grafana
        run: curl -fsS http://localhost:3001/api/health
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
